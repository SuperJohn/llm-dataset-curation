name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Cache fastText lid.176 model
        uses: actions/cache@v4
        with:
          path: ~/.cache/curate
          key: lid176-ftz-v1
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Curate sample end to end
        run: uv run curate run --config configs/sample.yaml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: curation-report
          path: |
            output/dolly-sample/report.html
            output/dolly-sample/report.md
            output/dolly-sample/report_assets/
            output/dolly-sample/stats.json
