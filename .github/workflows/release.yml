name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint + tests
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Verify wheel installs and CLI works
        run: |
          uv venv /tmp/curate-wheel
          uv pip install --python /tmp/curate-wheel dist/*.whl
          /tmp/curate-wheel/bin/curate --version
          /tmp/curate-wheel/bin/curate --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
