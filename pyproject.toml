[project]
name = "llm-dataset-curation"
version = "0.1.0"
description = "Config-driven curation pipeline for LLM text datasets: normalize, exact + MinHash near-dedupe, Gopher/C4-style quality filters, PII redaction, toxicity filtering, and an HTML eval report."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "John Houghton" }]
license = { text = "MIT" }
dependencies = [
    "polars>=1.10",
    "duckdb>=1.1",
    "datasketch>=1.6",
    "py3langid>=0.3",
    "pydantic>=2.8",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "requests>=2.32",
    "numpy>=1.26",
    "pyarrow>=26.0.0",
]

[project.scripts]
curate = "curate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
