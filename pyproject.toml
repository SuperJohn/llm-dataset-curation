[project]
name = "llm-dataset-curation"
dynamic = ["version"]
description = "Config-driven curation pipeline for LLM text datasets: normalize, exact + MinHash near-dedupe, Gopher/C4-style quality filters, PII redaction, toxicity filtering, and an HTML eval report."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "John Houghton", email = "8684226+SuperJohn@users.noreply.github.com" },
]
license = { text = "MIT" }
keywords = [
    "llm",
    "dataset",
    "curation",
    "deduplication",
    "pii",
    "data-quality",
    "nlp",
    "toxicity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.10",
    "duckdb>=1.1",
    "datasketch>=1.6",
    "pydantic>=2.8",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "requests>=2.32",
    "numpy>=1.26",
    "pyarrow>=26.0.0",
    "fasttext-predict>=0.9.2.4",
]

[project.urls]
Homepage = "https://github.com/SuperJohn/llm-dataset-curation"
Repository = "https://github.com/SuperJohn/llm-dataset-curation"
Issues = "https://github.com/SuperJohn/llm-dataset-curation/issues"
Changelog = "https://github.com/SuperJohn/llm-dataset-curation/releases"

[project.scripts]
curate = "curate.cli:main"

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
ner = [
    "spacy>=3.7",
]

[dependency-groups]
dev = [
    "nbformat>=5.11.1",
    "py3langid>=0.3",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/curate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/curate"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/configs",
    "/lexicons",
    "/data/sample",
    "/data/benchmarks",
    "/scripts",
    "/docs",
    "/notebooks",
    "/LICENSE",
    "/README.md",
    "/Makefile",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/.github",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
