# Runs offline on the checked-in sample (1,500 Dolly records + labelled synthetic noise (bad + clean controls)).
name: dolly-sample
input:
  paths:
    - data/sample/dolly_sample.jsonl
    - data/sample/synthetic_noise.jsonl
  format: jsonl
  id_field: id
  text_fields: [instruction, context, response]
output:
  dir: output/dolly-sample
  max_removed_examples: 5
stages:
  normalize:
    unicode_form: NFKC
  exact_dedupe:
    # identity = the instruction/response pair; shared context passages are not duplicates
    fields: [instruction, response]
  near_dedupe:
    fields: [instruction, response]
    threshold: 0.8     # est. Jaccard over word 5-gram shingles
    min_words: 20      # short templated Q&A ("Who founded House X?") is not duplication
    num_perm: 128
    ngram: 5
  quality:
    required_fields: [instruction, response]
    min_words: 5
    max_words: 10000
    min_alpha_word_fraction: 0.4   # instruction data has legit numeric lists
    max_symbol_word_ratio: 0.1
    max_duplicate_line_fraction: 0.3
    # Gopher's web-doc thresholds (0.20/0.18/0.16) over-filter short Q&A pairs, so relax them.
    max_top_ngram_char_fraction: {2: 0.30, 3: 0.28, 4: 0.25}
    repetition_min_words: 50
    banned_phrases: ["lorem ipsum", "enable javascript", "cookie policy"]
    language:
      fields: [instruction]   # detect on the prompt; see LanguageConfig docs
      allowed: [en]
      min_confidence: 0.9
      min_words: 8
  mitigation:
    pii:
      types: [email, phone, ipv4, credit_card, us_ssn]
      action: redact
    toxicity:
      lexicon_paths: [lexicons/toxicity_en.txt]
      max_hits: 2
      max_hit_fraction: 0.05
      classifier: null      # e.g. "curate.classifiers:detoxify_scores"
      classifier_threshold: 0.8
